<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img"
     aria-label="Placeholder mockup for the personal portfolio website project — not a real screenshot">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#070A12"/>
    </linearGradient>
    <linearGradient id="acc3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#4F7CFF"/>
    </linearGradient>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg3)"/>
  <rect width="1200" height="750" fill="url(#grid3)"/>
  <circle cx="980" cy="170" r="250" fill="#8B5CF6" opacity="0.11"/>
  <circle cx="170" cy="650" r="210" fill="#4F7CFF" opacity="0.09"/>

  <!-- window -->
  <rect x="70" y="70" width="1060" height="610" rx="18" fill="#0D1424" stroke="#ffffff" stroke-opacity="0.10"/>
  <rect x="70" y="70" width="1060" height="56" rx="18" fill="#101828"/>
  <rect x="70" y="108" width="1060" height="18" fill="#101828"/>
  <circle cx="104" cy="98" r="7" fill="#FF5F57"/><circle cx="128" cy="98" r="7" fill="#FEBC2E"/><circle cx="152" cy="98" r="7" fill="#28C840"/>
  <rect x="196" y="88" width="260" height="20" rx="10" fill="#ffffff" fill-opacity="0.06"/>

