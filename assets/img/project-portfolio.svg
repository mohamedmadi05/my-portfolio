  <g>
    <rect x="110" y="510" width="300" height="130" rx="14" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.07"/>
    <rect x="134" y="534" width="40" height="40" rx="11" fill="url(#acc3)" opacity="0.35"/>
    <rect x="134" y="590" width="180" height="12" rx="6" fill="#E9EEF9" fill-opacity="0.5"/>
    <rect x="134" y="612" width="120" height="10" rx="5" fill="#98A5BD" fill-opacity="0.35"/>

    <rect x="440" y="510" width="300" height="130" rx="14" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.07"/>
    <rect x="464" y="534" width="40" height="40" rx="11" fill="url(#acc3)" opacity="0.35"/>
    <rect x="464" y="590" width="200" height="12" rx="6" fill="#E9EEF9" fill-opacity="0.5"/>
    <rect x="464" y="612" width="100" height="10" rx="5" fill="#98A5BD" fill-opacity="0.35"/>

    <rect x="770" y="510" width="320" height="130" rx="14" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.07"/>
    <rect x="794" y="534" width="40" height="40" rx="11" fill="url(#acc3)" opacity="0.35"/>
    <rect x="794" y="590" width="210" height="12" rx="6" fill="#E9EEF9" fill-opacity="0.5"/>
    <rect x="794" y="612" width="140" height="10" rx="5" fill="#98A5BD" fill-opacity="0.35"/>
