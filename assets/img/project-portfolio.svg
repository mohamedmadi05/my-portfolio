  <rect x="110" y="150" width="980" height="42" rx="12" fill="#ffffff" fill-opacity="0.035"/>
  <rect x="130" y="162" width="60" height="18" rx="9" fill="url(#acc3)" opacity="0.9"/>
  <g fill="#98A5BD" fill-opacity="0.45">
    <rect x="820" y="165" width="46" height="12" rx="6"/><rect x="884" y="165" width="46" height="12" rx="6"/>
    <rect x="948" y="165" width="46" height="12" rx="6"/><rect x="1012" y="165" width="52" height="12" rx="6"/>
  </g>

  <!-- hero lines + avatar -->
  <rect x="110" y="240" width="460" height="30" rx="10" fill="#E9EEF9" fill-opacity="0.85"/>
  <rect x="110" y="288" width="360" height="30" rx="10" fill="url(#acc3)" opacity="0.85"/>
  <rect x="110" y="350" width="420" height="12" rx="6" fill="#98A5BD" fill-opacity="0.45"/>
  <rect x="110" y="374" width="380" height="12" rx="6" fill="#98A5BD" fill-opacity="0.35"/>
  <rect x="110" y="416" width="150" height="42" rx="12" fill="url(#acc3)"/>
  <rect x="276" y="416" width="150" height="42" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.16"/>

  <circle cx="880" cy="330" r="120" fill="#ffffff" fill-opacity="0.04" stroke="url(#acc3)" stroke-opacity="0.5" stroke-width="2"/>
  <text x="880" y="360" text-anchor="middle" font-family="Space Grotesk, Inter, sans-serif" font-size="72" font-weight="700" fill="url(#acc3)">MM</text>

